name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nova"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova?schema=public
      DATABASE_URL_RUNTIME: postgresql://nova_app:nova_app@localhost:5432/nova?schema=public
      PLATFORM_BOOTSTRAP_TOKEN: synthetic-ci-bootstrap-token
      PLATFORM_BOOTSTRAP_EMAIL: platform.admin@example.test
      PLATFORM_BOOTSTRAP_PASSWORD: Synthetic demo password 2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Seed deterministic browser-test data
        run: npm run prisma:seed -w @nova/api

      - name: Securely bootstrap synthetic Platform Administrator
        run: npm run platform:bootstrap -w @nova/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e
        env:
          API_HOST: 127.0.0.1
          API_PORT: 3001
          WEB_PORT: 3000
          API_INTERNAL_URL: http://127.0.0.1:3001
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_WEB_BASE_URL: http://127.0.0.1:3000
