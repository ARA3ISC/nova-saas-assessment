services:
  postgres:
    image: postgres:17-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova
    ports:
      - '5432:5432'
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data

volumes:
  nova-postgres-data:
